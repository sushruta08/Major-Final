name: 🛡️ SecureCI Security Pipeline

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── 1. Static Code Analysis ─────────────────────────────
  static-analysis:
    name: 🔍 Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install analysis tools
        run: |
          pip install bandit semgrep

      - name: Run Bandit (Python SAST)
        run: |
          bandit -r backend/app -f json -o bandit-report.json --exit-zero
          bandit -r security-engine -f json -o bandit-engine-report.json --exit-zero
        continue-on-error: true

      - name: Run Semgrep
        run: |
          semgrep --config=p/python --config=p/security-audit \
                  --json --output semgrep-report.json \
                  backend/app security-engine --exit-code 0
        continue-on-error: true

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            bandit-report.json
            semgrep-report.json
          retention-days: 30

  # ── 2. Secrets Detection ─────────────────────────────────
  secrets-scan:
    name: 🔑 Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

  # ── 3. Dependency Vulnerability Scan ────────────────────
  dependency-scan:
    name: 📦 Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Safety & pip-audit
        run: pip install safety pip-audit

      - name: Run Safety Check
        run: |
          safety check -r backend/requirements.txt --json \
            --output safety-report.json --exit-code 0
        continue-on-error: true

      - name: Run pip-audit
        run: |
          pip-audit -r backend/requirements.txt \
            --format json --output pip-audit-report.json
        continue-on-error: true

      - name: Upload dependency reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reports
          path: |
            safety-report.json
            pip-audit-report.json
          retention-days: 30

  # ── 4. Container Security Scan ──────────────────────────
  container-scan:
    name: 🐳 Container Security Scan
    runs-on: ubuntu-latest
    needs: [static-analysis]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build -f docker/Dockerfile.backend -t secureci-backend:${{ github.sha }} ./backend

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secureci-backend:${{ github.sha }}
          format: json
          output: trivy-container-report.json
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: container-security-report
          path: trivy-container-report.json
          retention-days: 30

  # ── 5. Frontend Tests ────────────────────────────────────
  frontend-tests:
    name: ⚛️ Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run tests
        run: npm run test
        working-directory: ./frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./frontend

  # ── 6. Backend Tests ─────────────────────────────────────
  backend-tests:
    name: 🐍 Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: secureci
          POSTGRES_PASSWORD: secureci_pass
          POSTGRES_DB: secureci_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ./backend

      - name: Run tests
        env:
          DATABASE_URL: postgresql://secureci:secureci_pass@localhost:5432/secureci_test
          SECRET_KEY: test-secret-key-32chars-minimum!!
        run: pytest tests/ -v --tb=short --cov=app
        working-directory: ./backend

  # ── 7. Security Report ───────────────────────────────────
  security-report:
    name: 📊 Security Report
    runs-on: ubuntu-latest
    needs: [static-analysis, secrets-scan, dependency-scan, container-scan]
    if: always()
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4

      - name: Summarize security findings
        run: |
          echo "## 🛡️ Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit (Python SAST) | ${{ needs.static-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks (Secrets) | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Safety (Dependencies) | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy (Container) | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY

  # ── 8. Deploy (main branch only) ────────────────────────
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests, security-report]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "✅ All security checks passed. Deploying to production..."
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
